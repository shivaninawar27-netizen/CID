<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>E-Commerce Website</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family: Arial, sans-serif;
    }

    body{
      background:#f4f4f4;
    }

    header{
      background:#222;
      color:white;
      padding:15px 40px;
      display:flex;
      justify-content:space-between;
      align-items:center;
    }

    header h1{
      font-size:28px;
    }

    nav a{
      color:white;
      text-decoration:none;
      margin-left:20px;
      font-size:18px;
    }

    .hero{
      height:400px;
      background:url('https://images.unsplash.com/photo-1523275335684-37898b6baf30') center/cover;
      display:flex;
      justify-content:center;
      align-items:center;
      color:white;
      text-align:center;
    }

    .hero h2{
      font-size:50px;
      background:rgba(0,0,0,0.5);
      padding:20px;
      border-radius:10px;
    }

    .products{
      padding:50px 40px;
    }

    .products h2{
      text-align:center;
      margin-bottom:30px;
      font-size:36px;
    }

    .product-grid{
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
      gap:25px;
    }

    .product-card{
      background:white;
      border-radius:10px;
      overflow:hidden;
      box-shadow:0 4px 8px rgba(0,0,0,0.1);
      transition:0.3s;
    }

    .product-card:hover{
      transform:translateY(-5px);
    }

    .product-card img{
      width:100%;
      height:250px;
      object-fit:cover;
    }

    .product-info{
      padding:20px;
      text-align:center;
    }

    .product-info h3{
      margin-bottom:10px;
    }

    .price{
      color:green;
      font-size:22px;
      margin-bottom:15px;
    }

    button{
      background:#222;
      color:white;
      border:none;
      padding:10px 20px;
      cursor:pointer;
      border-radius:5px;
      font-size:16px;
    }

    button:hover{
      background:#ff6600;
    }

    footer{
      background:#222;
      color:white;
      text-align:center;
      padding:20px;
      margin-top:40px;
    }
  </style>
</head>

<body>

  <header>
    <h1>ShopEasy</h1>

    <nav>
      <a href="#">Home</a>
      <a href="#">Products</a>
      <a href="#">About</a>
      <a href="#">Contact</a>
    </nav>
  </header>

  <section class="hero">
    <h2>Best Deals On Top Products</h2>
  </section>

  <section class="products">
    <h2>Featured Products</h2>

    <div class="product-grid">

      <div class="product-card">
        <img src="https://images.unsplash.com/photo-1542291026-7eec264c27ff" alt="Shoes">
        <div class="product-info">
          <h3>Running Shoes</h3>
          <p class="price">$49.99</p>
          <button>Add to Cart</button>
        </div>
      </div>

      <div class="product-card">
        <img src="https://images.unsplash.com/photo-1511707171634-5f897ff02aa9" alt="Phone">
        <div class="product-info">
          <h3>Smart Phone</h3>
          <p class="price">$299.99</p>
          <button>Add to Cart</button>
        </div>
      </div>

      <div class="product-card">
        <img src="https://images.unsplash.com/photo-1526170375885-4d8ecf77b99f" alt="Camera">
        <div class="product-info">
          <h3>DSLR Camera</h3>
          <p class="price">$599.99</p>
          <button>Add to Cart</button>
        </div>
      </div>

      <div class="product-card">
        <img src="https://images.unsplash.com/photo-1505740420928-5e560c06d30e" alt="Headphones">
        <div class="product-info">
          <h3>Headphones</h3>
          <p class="price">$79.99</p>
          <button>Add to Cart</button>
        </div>
      </div>

    </div>
  </section>

  <footer>
    <p>© 2026 ShopEasy | All Rights Reserved</p>
  </footer>

</body>
</html>
